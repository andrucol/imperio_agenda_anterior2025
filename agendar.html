    <script>
      // Inicializamos jQuery en modo seguro
      var $j = jQuery.noConflict();

      window.onload = function () {
        inicializarFechas();
        cargarListasDesplegables();
      };

      function inicializarFechas() {
        const selectDia = document.getElementById("dia");
        selectDia.innerHTML = '<option value="" disabled selected>Día</option>';
        for (let i = 1; i <= 31; i++) {
          let option = document.createElement("option");
          option.value = i;
          option.text = i;
          selectDia.appendChild(option);
        }
        document.getElementById("anio").value = new Date().getFullYear();
      }

      function cargarListasDesplegables() {
        // Aquí llenamos las listas que queremos con buscador
        google.script.run
          .withSuccessHandler(llenarSelect("profesional"))
          .getListaProfesionales();
        google.script.run
          .withSuccessHandler(llenarSelect("cliente"))
          .getListaClientes();
        google.script.run
          .withSuccessHandler(llenarSelect("procedimiento"))
          .getListaProcedimientos();
      }

      // --- FUNCIÓN MODIFICADA PARA ACTIVAR EL BUSCADOR ---
      function llenarSelect(id) {
        return function (items) {
          // Usamos jQuery para seleccionar el elemento
          const $sel = $j("#" + id);

          // 1. Si ya existe un Select2 previo, lo destruimos para actualizar limpio
          if ($sel.data("select2")) {
            $sel.select2("destroy");
          }

          // 2. Limpiamos y agregamos la opción vacía (necesaria para el placeholder)
          $sel.empty();
          $sel.append('<option value=""></option>');

          if (!items || items.length === 0) return;

          // 3. Llenamos las opciones
          items.forEach((item) => {
            if (item) {
              // new Option(texto, valor)
              let opt = new Option(item, item);
              $sel.append(opt);
            }
          });

          // 4. Activamos el Buscador Inteligente
          $sel.select2({
            placeholder: "Escriba o seleccione...",
            allowClear: true,
            width: "100%",
            language: {
              noResults: function () {
                return "No encontrado";
              },
            },
          });
        };
      }

      document
        .getElementById("btnCheckAvailability")
        .addEventListener("click", function () {
          const prof = document.getElementById("profesional").value;
          const area = document.getElementById("area").value;
          const dia = document.getElementById("dia").value;
          const mes = document.getElementById("mes").value;
          const anio = document.getElementById("anio").value;

          if (!prof || !area || !dia || !mes || !anio) {
            alert("⚠️ Completa Profesional, Área y Fecha.");
            return;
          }

          const btn = this;
          btn.textContent = "Buscando...";
          btn.disabled = true;

          google.script.run
            .withSuccessHandler(function (respuestaBackend) {
              procesarAgenda(respuestaBackend);
              btn.textContent = "Actualizar";
              btn.disabled = false;
            })
            .withFailureHandler(function (err) {
              alert("Error: " + err.message);
              btn.textContent = "Ver Disponibilidad";
              btn.disabled = false;
            })
            .verAgenda(prof, dia, mes, anio);
        });

      function procesarAgenda(data) {
        const section = document.getElementById("availabilitySection");
        section.style.opacity = "1";
        section.style.pointerEvents = "auto";

        const tbody = document.getElementById("agendaBody");
        const tableContainer = document.getElementById("agendaContainer");
        const emptyMsg = document.getElementById("emptyMessage");

        tbody.innerHTML = "";
        tableContainer.style.display = "block";

        if (data.citasOcupadas && data.citasOcupadas.length > 0) {
          data.citasOcupadas.sort(function (a, b) {
            function horaAMinutos(horaStr) {
              if (!horaStr) return 0;
              let s = horaStr.toString().toLowerCase().trim();
              let isPm = s.includes("pm");
              let isAm = s.includes("am");
              let tiempoLimpio = s.replace(/[a-z\s]/g, "");
              let partes = tiempoLimpio.split(":");
              let h = parseInt(partes[0], 10);
              let m = partes[1] ? parseInt(partes[1], 10) : 0;

              if (isPm && h !== 12) h += 12;
              if (isAm && h === 12) h = 0;
              return h * 60 + m;
            }
            return horaAMinutos(a.hora) - horaAMinutos(b.hora);
          });

          emptyMsg.style.display = "none";
          document.querySelector(".agenda-table").style.display = "table";

          data.citasOcupadas.forEach((cita) => {
            let row = tbody.insertRow();
            row.className = "agenda-row-booked";
            row.insertCell(0).innerHTML = `<strong>${cita.hora}</strong>`;
            row.insertCell(1).innerText = cita.cliente;
            row.insertCell(2).innerText = cita.proceso;

            let celdaPref = row.insertCell(3);
            celdaPref.innerText = cita.preferencia;
            if (cita.preferencia === "SI" || cita.preferencia === "Si") {
              celdaPref.style.color = "#C75B7A";
              celdaPref.style.fontWeight = "bold";
            }

            row.insertCell(4).innerText = cita.observaciones || "-";
          });
        } else {
          document.querySelector(".agenda-table").style.display = "none";
          emptyMsg.style.display = "block";
        }

        const selectHora = document.getElementById("hora");
        selectHora.innerHTML =
          '<option value="" disabled selected>Seleccione Hora</option>';

        if (data.horasDisponibles && data.horasDisponibles.length > 0) {
          data.horasDisponibles.sort(function (a, b) {
            return new Date("1970/01/01 " + a) - new Date("1970/01/01 " + b);
          });

          data.horasDisponibles.forEach((hora) => {
            let opt = document.createElement("option");
            opt.value = hora;
            opt.text = hora;
            selectHora.appendChild(opt);
          });
        }

        const btnAgendar = document.getElementById("btnAgendar");
        if (data.horasDisponibles && data.horasDisponibles.length > 0) {
          btnAgendar.disabled = false;
          selectHora.style.backgroundColor = "#E0F7FA";
        } else {
          btnAgendar.disabled = true;
          selectHora.style.backgroundColor = "#FFEBEE";
          let opt = document.createElement("option");
          opt.text = "Sin horarios";
          selectHora.appendChild(opt);
        }
      }

      // Lógica de envío del formulario con confirmación de WhatsApp
      document
        .getElementById("agendaForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const btn = document.getElementById("btnAgendar");
          btn.textContent = "Guardando...";
          btn.disabled = true;

          const prefVal = document.getElementById("preferencia").value;

          const datosFormulario = {
            profesional: document.getElementById("profesional").value,
            area: document.getElementById("area").value,
            dia: document.getElementById("dia").value,
            mes: document.getElementById("mes").value,
            anio: document.getElementById("anio").value,
            procedimiento: document.getElementById("procedimiento").value,
            hora: document.getElementById("hora").value,
            celular: document.getElementById("cliente").value,
            preferencia: prefVal === "Si" ? "SI" : "NO",
            observacion: document.getElementById("observaciones").value,
          };

          google.script.run
            .withSuccessHandler((respuesta) => {
              // Verificamos si la respuesta del servidor trajo los datos
              if (respuesta && respuesta.resultado === "OK") {
                // 1. Limpieza de interfaz
                document.getElementById("agendaForm").reset();
                $j("#cliente").val(null).trigger("change");
                $j("#profesional").val(null).trigger("change");
                $j("#procedimiento").val(null).trigger("change");
                document.getElementById("availabilitySection").style.opacity =
                  "0.5";
                document.getElementById(
                  "availabilitySection",
                ).style.pointerEvents = "none";
                inicializarFechas();

                btn.textContent = "Agendar Cita";
                btn.disabled = true;

                // 2. LÓGICA DE WHATSAPP
                // Agregamos el indicativo de Colombia (57) si el número no lo tiene
                let cel = respuesta.celular.toString().replace(/\D/g, ""); // Solo números
                if (!cel.startsWith("57")) {
                  cel = "57" + cel;
                }

                // Codificamos el mensaje para URL
                let texto = encodeURIComponent(respuesta.mensaje);
                let urlWhatsApp = `https://wa.me/${cel}?text=${texto}`;

                // 3. PREGUNTAR AL USUARIO
                // Usamos confirm() porque los navegadores bloquean window.open si no es acción directa
                let enviar = confirm(
                  "✅ ¡Cita Agendada con éxito!\n\n¿Deseas enviar la confirmación por WhatsApp ahora?",
                );

                if (enviar) {
                  window.open(urlWhatsApp, "_blank");
                }
              }
            })
            .withFailureHandler((err) => {
              alert("❌ Error: " + err.message);
              btn.disabled = false;
              btn.textContent = "Agendar Cita";
            })
            .guardarCita(datosFormulario);
        });
    </script>
