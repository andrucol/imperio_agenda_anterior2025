   Todas las reglas de abajo usan estas variables, así que
   para cambiar el tema basta con modificar estos valores.
*/
:root {
  --pink-primary: #c75b7a;    /* Rosa profundo - botones, acentos, iconos */
  --pink-secondary: #e8a8b8;  /* Rosa medio - bordes suaves, encabezados de tabla */

  --text-dark: #4a4a4a;       /* Gris oscuro - texto de párrafos */
  --text-header: #8e3b52;     /* Vino/rosa oscuro - títulos h2 */
  --white: #ffffff;
  --container-tint: #fffbfc;  /* Blanco con tinte rosado imperceptible - fondo del contenedor */

  --shadow-pink: 0 10px 30px rgba(199, 91, 122, 0.15); /* Sombra suave rosa para el contenedor */
  --input-bg: #fffafa;        /* Fondo de inputs y selects */
  --border-color: #f0d0d8;    /* Borde por defecto de inputs */

}

/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════

   Fuente "Patrick Hand" (manuscrita) para toda la app.
*/
body {
  background-color: var(--pink-light-bg);

  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Patrick Hand", cursive;
  font-size: 18px;
  padding: 20px;
  box-sizing: border-box;

}

/* ═══════════════════════════════════════════
   CONTENEDOR PRINCIPAL
   ═══════════════════════════════════════════
   Tarjeta blanca centrada con bordes redondeados,
   sombra rosada y una franja decorativa de color arriba.
*/
.container {
  background-color: var(--container-tint);
  border: 1px solid rgba(199, 91, 122, 0.2); /* Borde rosa sutil */
  border-radius: 20px;

  overflow: hidden;

/* Franja decorativa rosa en la parte superior del contenedor */
.container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: var(--pink-gradient);
}

/* ═══════════════════════════════════════════
   MENÚ DE NAVEGACIÓN HORIZONTAL
   ═══════════════════════════════════════════
   Barra tipo "pill" con los 3 botones: Agendar, Crear, Eliminar.

*/

}

/* Links dentro del nav (envuelven a los botones) */

}

/* Botones individuales del menú */

/* ═══════════════════════════════════════════

*/
input, select, textarea {
  width: 100%;

  border-radius: 12px;

/* Efecto focus: borde rosa con anillo de enfoque */

  border-color: var(--pink-primary);

  background-color: #fff;
}

/* Selects: Flecha personalizada rosa (SVG inline codificado en URL) */

  background-repeat: no-repeat;
  background-position: right 15px top 50%;

}

/* Inputs inválidos: borde rosado suave de error (solo cuando el usuario ya escribió algo) */
input:invalid:not(:placeholder-shown) {
  border-color: #ffb3c6;
  background-color: #fff0f3;
}

/* ═══════════════════════════════════════════
   BOTÓN PRINCIPAL (.submit-btn)
   ═══════════════════════════════════════════
   Degradado rosa, bordes pill, sombra y micro-animaciones.
*/
.submit-btn {
  background: var(--pink-gradient);
  color: white;
  padding: 16px 20px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  width: 100%;
  font-family: "Patrick Hand", cursive;
  font-size: 20px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: all 0.3s ease;
  margin-top: 15px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  box-shadow: 0 4px 15px rgba(199, 91, 122, 0.3);
}

/* Hover: Sombra más intensa y elevación */
.submit-btn:hover {
  box-shadow: 0 8px 20px rgba(199, 91, 122, 0.4);
  transform: translateY(-2px);
}

/* Click: Escala ligeramente más pequeña (feedback táctil) */
.submit-btn:active {
  transform: scale(0.98);
}

/* Deshabilitado: Rosa grisáceo sin sombra ni animaciones */
.submit-btn:disabled {
  background: #e0c0c8;
  color: #fff;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

}

/* Flecha desplegable a la derecha */

  height: 40px !important;

/* Estado abierto (focus): Borde rosa con anillo */

/* Menú desplegable con las opciones */
.select2-dropdown {

/* Opción resaltada (hover/teclado) en la lista */
.select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
  background-color: var(--pink-primary) !important;
  color: white !important;
}

      /**
       * inicializarFechas()
       * Llena el dropdown de días (1 al 31) y establece el año actual.
       */
      function inicializarFechas() {
        const selectDia = document.getElementById("dia");
        selectDia.innerHTML = '<option value="" disabled selected>Día</option>';
        for (let i = 1; i <= 31; i++) {
          let option = document.createElement("option");
          option.value = i;
          option.text = i;
          selectDia.appendChild(option);
        }
        document.getElementById("anio").value = new Date().getFullYear();
      }

      /**
       * cargarListasDesplegables()
       * Pide al servidor las listas de profesionales, clientes y procedimientos
       * para llenar los dropdowns con buscador (Select2).
       */
      function cargarListasDesplegables() {
        google.script.run
          .withSuccessHandler(llenarSelect("profesional"))
          .getListaProfesionales();
        google.script.run
          .withSuccessHandler(llenarSelect("cliente"))
          .getListaClientes();
        google.script.run
          .withSuccessHandler(llenarSelect("procedimiento"))
          .getListaProcedimientos();
      }

      /**
       * llenarSelect(id)
       * Retorna una función callback que, al recibir los datos del servidor,
       * llena un <select> específico y le activa el buscador Select2.
       * Se usa como "factory" para manejar múltiples selects con el mismo patrón.
       *
       * @param {string} id - ID del elemento <select> a llenar.
       * @returns {Function} Callback para google.script.run.withSuccessHandler.
       */
      function llenarSelect(id) {
        return function (items) {
          const $sel = $j("#" + id);

          // 1. Destruir Select2 previo si existe (para evitar duplicados)
          if ($sel.data("select2")) {
            $sel.select2("destroy");
          }

          // 2. Limpiar y agregar opción vacía (requerida por Select2 para placeholder)
          $sel.empty();
          $sel.append('<option value=""></option>');

          if (!items || items.length === 0) return;

          // 3. Agregar cada item como opción
          items.forEach((item) => {
            if (item) {
              let opt = new Option(item, item);
              $sel.append(opt);
            }
          });

          // 4. Activar el buscador inteligente
          $sel.select2({
            placeholder: "Escriba o seleccione...",
            allowClear: true,
            width: "100%",
            language: {
              noResults: function () {
                return "No encontrado";
              },
            },
          });
        };
      }

      // ═══ BOTÓN "VER DISPONIBILIDAD" ═══
      // Consulta al servidor las citas existentes para la fecha/profesional seleccionado.
      document
        .getElementById("btnCheckAvailability")
        .addEventListener("click", function () {
          const prof = document.getElementById("profesional").value;
          const area = document.getElementById("area").value;
          const dia = document.getElementById("dia").value;
          const mes = document.getElementById("mes").value;
          const anio = document.getElementById("anio").value;

          // Validar que todos los campos estén completos
          if (!prof || !area || !dia || !mes || !anio) {
            alert("⚠️ Completa Profesional, Área y Fecha.");
            return;
          }

          // Mostrar estado de carga
          const btn = this;
          btn.textContent = "Buscando...";
          btn.disabled = true;

          // Llamar a verAgenda() en agendamientoWeb.gs
          google.script.run
            .withSuccessHandler(function (respuestaBackend) {
              procesarAgenda(respuestaBackend);
              btn.textContent = "Actualizar";
              btn.disabled = false;
            })
            .withFailureHandler(function (err) {
              alert("Error: " + err.message);
              btn.textContent = "Ver Disponibilidad";
              btn.disabled = false;
            })
            .verAgenda(prof, dia, mes, anio);
        });

      /**
       * procesarAgenda(data)
       * Recibe los datos del servidor y actualiza la interfaz:
       *   - Muestra la tabla de citas ocupadas (o mensaje de "libre")
       *   - Llena el dropdown de horas disponibles
       *   - Habilita/deshabilita el botón "Agendar Cita"
       *
       * @param {Object} data - { horasDisponibles: string[], citasOcupadas: Object[] }
       */
      function procesarAgenda(data) {
        // Habilitar la sección 2 y 3 (quitar opacidad y reactivar clics)
        const section = document.getElementById("availabilitySection");
        section.style.opacity = "1";
        section.style.pointerEvents = "auto";

        const tbody = document.getElementById("agendaBody");
        const tableContainer = document.getElementById("agendaContainer");
        const emptyMsg = document.getElementById("emptyMessage");

        // Limpiar tabla anterior
        tbody.innerHTML = "";
        tableContainer.style.display = "block";

        // ─── Mostrar citas ocupadas ───
        if (data.citasOcupadas && data.citasOcupadas.length > 0) {
          // Ordenar citas por hora (convertir "3 PM" a minutos para comparar)
          data.citasOcupadas.sort(function (a, b) {
            function horaAMinutos(horaStr) {
              if (!horaStr) return 0;
              let s = horaStr.toString().toLowerCase().trim();
              let isPm = s.includes("pm");
              let isAm = s.includes("am");
              let tiempoLimpio = s.replace(/[a-z\s]/g, "");
              let partes = tiempoLimpio.split(":");
              let h = parseInt(partes[0], 10);
              let m = partes[1] ? parseInt(partes[1], 10) : 0;

              if (isPm && h !== 12) h += 12;  // 1 PM = 13:00
              if (isAm && h === 12) h = 0;     // 12 AM = 00:00
              return h * 60 + m;
            }
            return horaAMinutos(a.hora) - horaAMinutos(b.hora);
          });

          emptyMsg.style.display = "none";
          document.querySelector(".agenda-table").style.display = "table";

          // Crear una fila por cada cita
          data.citasOcupadas.forEach((cita) => {
            let row = tbody.insertRow();
            row.className = "agenda-row-booked";
            row.insertCell(0).innerHTML = `<strong>${cita.hora}</strong>`;
            row.insertCell(1).innerText = cita.cliente;
            row.insertCell(2).innerText = cita.proceso;

            // Resaltar preferencia "SI" en rosa
            let celdaPref = row.insertCell(3);
            celdaPref.innerText = cita.preferencia;
            if (cita.preferencia === "SI" || cita.preferencia === "Si") {
              celdaPref.style.color = "#C75B7A";
              celdaPref.style.fontWeight = "bold";
            }

            row.insertCell(4).innerText = cita.observaciones || "-";
          });
        } else {
          // No hay citas: mostrar mensaje de "Libre"
          document.querySelector(".agenda-table").style.display = "none";
          emptyMsg.style.display = "block";
        }

        // ─── Llenar el dropdown de horas disponibles ───
        const selectHora = document.getElementById("hora");
        selectHora.innerHTML =
          '<option value="" disabled selected>Seleccione Hora</option>';

        if (data.horasDisponibles && data.horasDisponibles.length > 0) {
          // Ordenar horas cronológicamente
          data.horasDisponibles.sort(function (a, b) {
            return new Date("1970/01/01 " + a) - new Date("1970/01/01 " + b);
          });

          data.horasDisponibles.forEach((hora) => {
            let opt = document.createElement("option");
            opt.value = hora;
            opt.text = hora;
            selectHora.appendChild(opt);
          });
        }

        // ─── Habilitar/deshabilitar botón de agendar según disponibilidad ───
        const btnAgendar = document.getElementById("btnAgendar");
        if (data.horasDisponibles && data.horasDisponibles.length > 0) {
          btnAgendar.disabled = false;
          selectHora.style.backgroundColor = "#E0F7FA"; // Fondo azul cielo = hay disponibilidad
        } else {
          btnAgendar.disabled = true;
          selectHora.style.backgroundColor = "#FFEBEE"; // Fondo rojo suave = no hay horas libres
          let opt = document.createElement("option");
          opt.text = "Sin horarios";
          selectHora.appendChild(opt);
        }
      }

      // ═══ ENVÍO DEL FORMULARIO (Botón "Agendar Cita") ═══
      // Recopila todos los datos y llama a guardarCita() en agendamientoWeb.gs.
      // Si la cita se guarda exitosamente, ofrece enviar confirmación por WhatsApp.
      document
        .getElementById("agendaForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const btn = document.getElementById("btnAgendar");
          btn.textContent = "Guardando...";
          btn.disabled = true;

          const prefVal = document.getElementById("preferencia").value;

          // Recopilar todos los campos del formulario
          const datosFormulario = {
            profesional: document.getElementById("profesional").value,
            area: document.getElementById("area").value,
            dia: document.getElementById("dia").value,
            mes: document.getElementById("mes").value,
            anio: document.getElementById("anio").value,
            procedimiento: document.getElementById("procedimiento").value,
            hora: document.getElementById("hora").value,
            celular: document.getElementById("cliente").value,
            preferencia: prefVal === "Si" ? "SI" : "NO",
            observacion: document.getElementById("observaciones").value,
          };

          // Enviar al servidor
          google.script.run
            .withSuccessHandler((respuesta) => {
              if (respuesta && respuesta.resultado === "OK") {
                // ─── 1. Limpiar interfaz ───
                document.getElementById("agendaForm").reset();
                $j("#cliente").val(null).trigger("change");
                $j("#profesional").val(null).trigger("change");
                $j("#procedimiento").val(null).trigger("change");
                document.getElementById("availabilitySection").style.opacity =
                  "0.5";
                document.getElementById(
                  "availabilitySection",
                ).style.pointerEvents = "none";
                inicializarFechas();

                btn.textContent = "Agendar Cita";
                btn.disabled = true;

                // ─── 2. Preparar enlace de WhatsApp ───
                // Agregar indicativo de Colombia (57) si no lo tiene
                let cel = respuesta.celular.toString().replace(/\D/g, "");
                if (!cel.startsWith("57")) {
                  cel = "57" + cel;
                }

                // Codificar el mensaje para la URL
                let texto = encodeURIComponent(respuesta.mensaje);
                let urlWhatsApp = `https://wa.me/${cel}?text=${texto}`;

                // ─── 3. Preguntar si desea enviar la confirmación ───
                let enviar = confirm(
                  "✅ ¡Cita Agendada con éxito!\n\n¿Deseas enviar la confirmación por WhatsApp ahora?",
                );

                if (enviar) {
                  window.open(urlWhatsApp, "_blank");
                }
              }
            })
            .withFailureHandler((err) => {
              alert("❌ Error: " + err.message);
              btn.disabled = false;
              btn.textContent = "Agendar Cita";
            })
            .guardarCita(datosFormulario);
        });
    </script>
  </body>
</html>
