<!--
  ============================================
  estilos.html - HOJA DE ESTILOS GLOBAL (CSS)
  ============================================

  Este archivo contiene TODOS los estilos CSS compartidos entre
  las 3 vistas de la web app: agendar.html, crear.html y eliminar.html.

  Se inyecta en cada página usando el scriptlet de GAS:
    <?!= HtmlService.createHtmlOutputFromFile('estilos').getContent(); ?>

  VENTAJA: Si quieres cambiar el color principal, la fuente, los bordes
  o cualquier estilo visual, solo se edita ESTE archivo y el cambio
  se aplica automáticamente a todas las páginas.
-->
<style>
/* ═══════════════════════════════════════════
   VARIABLES CSS (Custom Properties)
   ═══════════════════════════════════════════
   Define la paleta de colores completa "Pink Elegance".
   Todas las reglas de abajo usan estas variables, así que
   para cambiar el tema basta con modificar estos valores.
*/
:root {
  --pink-primary: #c75b7a;    /* Rosa profundo - botones, acentos, iconos */
  --pink-secondary: #e8a8b8;  /* Rosa medio - bordes suaves, encabezados de tabla */
  --pink-light-bg: #fff2f6;   /* Rosa muy suave - fondo general de la página */
  --pink-gradient: linear-gradient(135deg, #c75b7a 0%, #f48fb1 100%); /* Degradado de los botones principales */

  --text-dark: #4a4a4a;       /* Gris oscuro - texto de párrafos */
  --text-header: #8e3b52;     /* Vino/rosa oscuro - títulos h2 */
  --white: #ffffff;
  --container-tint: #fffbfc;  /* Blanco con tinte rosado imperceptible - fondo del contenedor */

  --shadow-pink: 0 10px 30px rgba(199, 91, 122, 0.15); /* Sombra suave rosa para el contenedor */
  --input-bg: #fffafa;        /* Fondo de inputs y selects */
  --border-color: #f0d0d8;    /* Borde por defecto de inputs */
  --danger-color: #d9534f;    /* Rojo elegante para botón de eliminar */
  --booked-bg: #e6e6fa;       /* Lavanda - fondo de filas de citas ocupadas */
}

/* ═══════════════════════════════════════════
   BODY - Fondo y tipografía base
   ═══════════════════════════════════════════
   Patrón de puntos rosados como fondo decorativo.
   Fuente "Patrick Hand" (manuscrita) para toda la app.
*/
body {
  background-color: var(--pink-light-bg);
  background-image: radial-gradient(#e8a8b8 1px, transparent 1px); /* Puntos rosados */
  background-size: 25px 25px;     /* Espaciado entre puntos */
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Patrick Hand", cursive;
  font-size: 18px;
  padding: 20px;
  box-sizing: border-box;
  color: var(--text-dark);
}

/* ═══════════════════════════════════════════
   CONTENEDOR PRINCIPAL
   ═══════════════════════════════════════════
   Tarjeta blanca centrada con bordes redondeados,
   sombra rosada y una franja decorativa de color arriba.
*/
.container {
  background-color: var(--container-tint);
  border: 1px solid rgba(199, 91, 122, 0.2); /* Borde rosa sutil */
  border-radius: 20px;
  box-shadow: var(--shadow-pink);
  width: 100%;
  max-width: 500px;
  padding: 40px 30px;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}

/* Franja decorativa rosa en la parte superior del contenedor */
.container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: var(--pink-gradient);
}

/* ═══════════════════════════════════════════
   MENÚ DE NAVEGACIÓN HORIZONTAL
   ═══════════════════════════════════════════
   Barra tipo "pill" con los 3 botones: Agendar, Crear, Eliminar.
   Se envuelve (flex-wrap) en pantallas pequeñas.
*/
.nav-container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  margin-top: 10px;
  margin-bottom: 20px;
  background: #ffffff;
  padding: 8px 10px;
  gap: 5px;
  border-radius: 50px;            /* Forma de "pastilla" */
  border: 1px solid rgba(199, 91, 122, 0.15);
  box-shadow: 0 4px 15px rgba(199, 91, 122, 0.1);
  flex-wrap: wrap;                /* Permite salto de línea en móvil */
}

/* Links dentro del nav (envuelven a los botones) */
.nav-container a {
  text-decoration: none;
  display: flex;
  flex: 0 1 auto;
}

/* Botones individuales del menú */
.nav-container button {
  background: transparent;
  border: none;
  font-family: "Patrick Hand", cursive;
  font-size: 16px;
  letter-spacing: 0.5px;
  color: #888888;
  padding: 6px 12px;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
}

/* Efecto hover: fondo rosado suave y elevación sutil */
.nav-container button:hover {
  background-color: #fff2f6;
  color: #c75b7a;
  transform: translateY(-2px);
}

/* ═══════════════════════════════════════════
   LOGO SVG (Icono decorativo en el header)
   ═══════════════════════════════════════════
   Soporta ambas clases: "header-icon" (crear.html) y
   "logo-header" (agendar.html, eliminar.html).
*/
.header-icon, .logo-header {
  display: block;
  margin: 0 auto 15px;
  color: var(--pink-primary);
  width: 55px;
  height: 55px;
  filter: drop-shadow(0px 3px 5px rgba(199, 91, 122, 0.2));
}

/* ═══════════════════════════════════════════
   TIPOGRAFÍA - Títulos
   ═══════════════════════════════════════════ */
h2 {
  text-align: center;
  font-family: "Patrick Hand", cursive;
  color: var(--text-header);       /* Color vino */
  margin: 0 0 25px 0;
  font-size: 32px;
  letter-spacing: 1px;
  font-weight: 400;               /* Patrick Hand ya es bold por naturaleza */
}

/* ═══════════════════════════════════════════
   FORMULARIOS - Grupos y layout
   ═══════════════════════════════════════════ */
.form-group {
  margin-bottom: 20px;
}

/* Fila horizontal de campos (ej: Tipo Doc + No. Documento) */
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.row > div {
  flex: 1 1 100%;
  min-width: 0;
}

/* ═══════════════════════════════════════════
   FORMULARIOS - Labels
   ═══════════════════════════════════════════ */
label {
  font-size: 16px;
  color: var(--text-dark);
  font-weight: 400;
  margin-bottom: 8px;
  display: block;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ═══════════════════════════════════════════
   FORMULARIOS - Inputs, Selects, Textareas
   ═══════════════════════════════════════════
   Estilo unificado para todos los campos de entrada.
*/
input, select, textarea {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background-color: var(--input-bg);
  font-family: "Patrick Hand", cursive;
  font-size: 18px;
  color: #555;
  box-sizing: border-box;
  transition: all 0.3s ease;
  outline: none;
}

/* Efecto focus: borde rosa con anillo de enfoque */
input:focus, select:focus, textarea:focus {
  border-color: var(--pink-primary);
  box-shadow: 0 0 0 4px rgba(199, 91, 122, 0.1);
  background-color: #fff;
}

/* Selects: Flecha personalizada rosa (SVG inline codificado en URL) */
select {
  appearance: none;              /* Quitar la flecha nativa del navegador */
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23C75B7A%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat: no-repeat;
  background-position: right 15px top 50%;
  background-size: 12px auto;
}

/* Inputs inválidos: borde rosado suave de error (solo cuando el usuario ya escribió algo) */
input:invalid:not(:placeholder-shown) {
  border-color: #ffb3c6;
  background-color: #fff0f3;
}

/* ═══════════════════════════════════════════
   BOTÓN PRINCIPAL (.submit-btn)
   ═══════════════════════════════════════════
   Degradado rosa, bordes pill, sombra y micro-animaciones.
*/
.submit-btn {
  background: var(--pink-gradient);
  color: white;
  padding: 16px 20px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  width: 100%;
  font-family: "Patrick Hand", cursive;
  font-size: 20px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: all 0.3s ease;
  margin-top: 15px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  box-shadow: 0 4px 15px rgba(199, 91, 122, 0.3);
}

/* Hover: Sombra más intensa y elevación */
.submit-btn:hover {
  box-shadow: 0 8px 20px rgba(199, 91, 122, 0.4);
  transform: translateY(-2px);
}

/* Click: Escala ligeramente más pequeña (feedback táctil) */
.submit-btn:active {
  transform: scale(0.98);
}

/* Deshabilitado: Rosa grisáceo sin sombra ni animaciones */
.submit-btn:disabled {
  background: #e0c0c8;
  color: #fff;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ═══════════════════════════════════════════
   ESTILOS PARA SELECT2 (Buscador inteligente)
   ═══════════════════════════════════════════
   Select2 es una librería jQuery que convierte un <select>
   normal en un dropdown con buscador de texto integrado.
   Estos estilos sobreescriben los defaults de Select2
   para que combine con el tema "Pink Elegance".
   Se usan !important porque Select2 aplica estilos inline.
*/

/* Caja principal del input de Select2 */
.select2-container .select2-selection--single {
  height: 42px !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 8px !important;
  background-color: var(--input-bg) !important;
  display: flex;
  align-items: center;
}

/* Texto renderizado dentro del input */
.select2-container .select2-selection--single .select2-selection__rendered {
  color: #555 !important;
  font-family: "Patrick Hand", cursive !important;
  font-size: 18px !important;
  padding-left: 10px !important;
  line-height: normal !important;
}

/* Flecha desplegable a la derecha */
.select2-container .select2-selection--single .select2-selection__arrow {
  height: 40px !important;
  right: 5px !important;
}

/* Estado abierto (focus): Borde rosa con anillo */
.select2-container--default.select2-container--open .select2-selection--single {
  border-color: var(--pink-primary) !important;
  box-shadow: 0 0 0 3px rgba(199, 91, 122, 0.1) !important;
}

/* Menú desplegable con las opciones */
.select2-dropdown {
  border: 1px solid var(--pink-primary) !important;
  border-radius: 8px !important;
  overflow: hidden !important;
  z-index: 9999 !important;
  font-family: "Patrick Hand", cursive !important;
  font-size: 16px !important;
}

/* Opción resaltada (hover/teclado) en la lista */
.select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
  background-color: var(--pink-primary) !important;
  color: white !important;
}
</style>
