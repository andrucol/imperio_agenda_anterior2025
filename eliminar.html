    <!-- Estilos locales específicos de esta página -->

      /* Contenedor vertical para los 2 botones (Revisar + Eliminar) */

    </style>

    <!-- Select2: librería jQuery para convertir dropdowns en buscadores -->
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- ═══ Menú de navegación entre páginas ═══ -->
      <!-- Los links usan la variable pubUrl (inyectada por doGet) para navegar entre vistas -->
      <div class="nav-container">
        <a href="<?= pubUrl ?>?v=agendar"><button>Agendar</button></a>
        <a href="<?= pubUrl ?>?v=crear"><button>Crear</button></a>
        <a href="<?= pubUrl ?>?v=eliminar"><button>Eliminar</button></a>
      </div>

      <!-- ═══ Logo SVG decorativo ═══ -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="logo-header"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M2 9a10 10 0 1 0 20 0" />
        <path d="M12 19a10 10 0 0 1 10 -10" />
        <path d="M2 9a10 10 0 0 1 10 10" />
        <path d="M12 4a9.7 9.7 0 0 1 2.99 7.5" />
        <path d="M9.01 11.5a9.7 9.7 0 0 1 2.99 -7.5" />
      </svg>

      <!-- ═══ Título de la página ═══ -->
      <h2>Gestión de Cliente Sede</h2>

      <!-- ═══ Formulario de gestión ═══ -->
      <form id="eliminationForm">
        <!-- Selector de cliente (se convierte en buscador con Select2) -->
        <div class="form-group">
          <label for="clientNumber">Seleccionar Número:</label>
          <select id="clientNumber" name="clientNumber" required>
            <option value="" disabled selected>Cargando lista...</option>
          </select>
        </div>

        <!-- Área de texto para mostrar los datos consultados o mensajes de estado -->
        <div class="form-group">
          <label for="resultado">Estado / Resultado:</label>
          <textarea
            id="resultado"
            readonly
            placeholder="La información aparecerá aquí..."
          ></textarea>
        </div>

        <!-- Botones de acción -->
        <div class="btn-container">
          <button id="verCliente" type="button" class="submit-btn">
            Revisar Datos
          </button>

          <button id="eliminarCliente" type="button" class="submit-btn">
            Eliminar Cliente
          </button>
        </div>
      </form>
    </div>

    <script>
      // ═══════════════════════════════════════
      // JAVASCRIPT - Lógica del lado del cliente
      // ═══════════════════════════════════════

      // Inicializar jQuery en "modo seguro" para evitar conflictos con otras librerías
      var $j = jQuery.noConflict();

      /**
       * Al cargar la página: pedir la lista de clientes al servidor
       * y llenar el dropdown con buscador (Select2).
       */
      window.onload = function () {
        try {
          // Llamar al backend (codigo.gs) para obtener los números de celular
          google.script.run
            .withSuccessHandler(poblarSelect)
            .obtenerNumerosClientes();
        } catch (e) {
          // Modo local (sin GAS): cargar datos de prueba
          console.warn("Ejecutando fuera de Apps Script (modo local)");
          poblarSelect([3102875348, 3204567890, 3001234567]);
        }
      };

      /**
       * poblarSelect(clientes)
       * Recibe la lista de celulares del servidor y configura el dropdown
       * como un buscador inteligente usando la librería Select2.
       * Se re-ejecuta cada vez que se elimina un cliente para actualizar la lista.
       *
       * @param {Array} clientes - Lista de números de celular.
       */
      function poblarSelect(clientes) {
        var $select = $j("#clientNumber");

        // 1. Destruir Select2 previo (si existe) para recrear limpio
        if ($select.data("select2")) {
          $select.select2("destroy");
        }

        // 2. Limpiar todas las opciones del <select>
        $select.empty();

        // 3. Opción vacía requerida por Select2 para mostrar el placeholder
        $select.append('<option value=""></option>');

        // 4. Agregar cada cliente como opción del dropdown
        if (clientes) {
          clientes.forEach(function (cliente) {
            var option = new Option(cliente, cliente);
            $select.append(option);
          });
        }

        // 5. Activar Select2 con configuración en español
        $select.select2({
          placeholder: "Escriba o seleccione un número...",
          allowClear: true,
          width: "100%",
          language: {
            noResults: function () {
              return "No se encontró el número";
            },
          },
        });
      }

      /**
       * mostrarPantalla(resultado)
       * Callback que muestra la respuesta del servidor en el área de texto
       * y restaura el botón "Revisar" a su estado original.
       *
       * @param {string} resultado - Texto con los datos del cliente o mensaje de error.
       */
      function mostrarPantalla(resultado) {
        var pantalla = document.getElementById("resultado");
        var botonRevisar = document.getElementById("verCliente");

        pantalla.value = resultado;
        botonRevisar.textContent = "Revisar Datos";
        botonRevisar.disabled = false;
      }

      // ═══ BOTÓN "REVISAR DATOS" ═══
      // Busca los datos del cliente seleccionado usando búsqueda binaria en el servidor.
      document
        .getElementById("verCliente")
        .addEventListener("click", function () {
          var botonRevisar = document.getElementById("verCliente");
          var pantalla = document.getElementById("resultado");

          // Obtener el valor seleccionado (Select2 mantiene el valor en el <select> original)
          var selector = document.getElementById("clientNumber");
          var valor = Number(selector.value);

          // Validar que se haya seleccionado algo
          if (!selector.value) {
            pantalla.value =
              "⚠️ Por favor, busca y selecciona un número primero.";
            return;
          }

          // Mostrar estado de carga
          botonRevisar.disabled = true;
          botonRevisar.innerHTML = "Cargando...";
          pantalla.value = "⏳ Consultando base de datos...";

          try {
            // Llamar a obtenerDatosClientes() en codigo.gs
            google.script.run
              .withSuccessHandler(mostrarPantalla)
              .obtenerDatosClientes(valor);
          } catch (e) {
            // Modo prueba local
            mostrarPantalla(
              "Nombre: Cliente Prueba\nCC: 12345\nEmail: test@test.com\n(Modo Prueba)",
            );
          }
        });

      // ═══ BOTÓN "ELIMINAR CLIENTE" ═══
      // Pide confirmación antes de eliminar. Después refresca la lista automáticamente.
      document
        .getElementById("eliminarCliente")
        .addEventListener("click", function () {
          var selector = document.getElementById("clientNumber");
          var valor = Number(selector.value);
          var pantalla = document.getElementById("resultado");

          // Validar selección
          if (!selector.value) {
            pantalla.value = "⚠️ Selecciona un cliente para eliminar.";
            return;
          }

          // Confirmación de seguridad
          var confirmacion = confirm(
            "¿Estás SEGURO de que deseas eliminar al cliente número " +
              valor +
              "?\n\nEsta acción no se puede deshacer.",
          );

          if (!confirmacion) {
            pantalla.value = "Eliminación cancelada.";
            return;
          }

          // Mostrar estado de eliminación
          var botonEliminar = document.getElementById("eliminarCliente");
          botonEliminar.disabled = true;
          botonEliminar.textContent = "Eliminando...";
          pantalla.value = "⏳ Procesando eliminación...";

          try {
            // Llamar a eliminarDatosClientes() en codigo.gs
            google.script.run
              .withSuccessHandler(function (mensaje) {
                pantalla.value = mensaje;
                botonEliminar.textContent = "Eliminar Cliente";
                botonEliminar.disabled = false;

                // Recargar la lista de clientes (poblarSelect actualiza el buscador)
                google.script.run
                  .withSuccessHandler(poblarSelect)
                  .obtenerNumerosClientes();

                // Limpiar la selección visual de Select2
                $j("#clientNumber").val(null).trigger("change");
              })
              .eliminarDatosClientes(valor);
          } catch (e) {
            pantalla.value = "❌ Error de conexión (Local)";
            botonEliminar.disabled = false;
            botonEliminar.textContent = "Eliminar Cliente";
          }
        });
    </script>
  </body>
</html>
