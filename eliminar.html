  <body>
    <div class="container">
      <div class="nav-container">
        <a href="<?= pubUrl ?>?v=agendar"><button>Agendar</button></a>
        <a href="<?= pubUrl ?>?v=crear"><button>Crear</button></a>

      <svg
        xmlns="http://www.w3.org/2000/svg"

        stroke="currentColor"

        <path d="M9.01 11.5a9.7 9.7 0 0 1 2.99 -7.5" />

      <h2>Gestión de Cliente Sede</h2>

      <form id="eliminationForm">
        <div class="form-group">
          <label for="clientNumber">Seleccionar Número:</label>
          <select id="clientNumber" name="clientNumber" required>
            <option value="" disabled selected>Cargando lista...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="resultado">Estado / Resultado:</label>
          <textarea
            id="resultado"
            readonly
            placeholder="La información aparecerá aquí..."
          ></textarea>
        </div>

        <div class="btn-container">
          <button id="verCliente" type="button" class="submit-btn">
            Revisar Datos
          </button>

          <button id="eliminarCliente" type="button" class="submit-btn">
            Eliminar Cliente
          </button>
        </div>
      </form>
    </div>

    <script>
      // Variable global para usar jQuery fácilmente
      var $j = jQuery.noConflict();

      window.onload = function () {
        // Llamada inicial
        try {
          google.script.run
            .withSuccessHandler(poblarSelect)
            .obtenerNumerosClientes();
        } catch (e) {
          console.warn("Ejecutando fuera de Apps Script (modo local)");
          poblarSelect([3102875348, 3204567890, 3001234567]);
        }
      };

      // --- AQUÍ ESTÁ EL CAMBIO CLAVE PARA EL BUSCADOR ---
      function poblarSelect(clientes) {
        var $select = $j("#clientNumber"); // Seleccionamos con jQuery

        // 1. Si ya existe un buscador previo (ej. tras eliminar), lo destruimos para recrearlo limpio
        if ($select.data("select2")) {
          $select.select2("destroy");
        }

        // 2. Limpiamos el HTML interno
        $select.empty();

        // 3. Agregamos una opción vacía (necesaria para que funcione el placeholder)
        $select.append('<option value=""></option>');

        // 4. Llenamos la lista con los clientes
        if (clientes) {
          clientes.forEach(function (cliente) {
            // new Option(texto, valor)
            var option = new Option(cliente, cliente);
            $select.append(option);
          });
        }

        // 5. ACTIVAMOS LA LIBRERÍA SELECT2 (El Buscador)
        $select.select2({
          placeholder: "Escriba o seleccione un número...",
          allowClear: true,
          width: "100%", // Para que no se vea cortado en celular
          language: {
            noResults: function () {
              return "No se encontró el número";
            },
          },
        });
      }

      function mostrarPantalla(resultado) {
        var pantalla = document.getElementById("resultado");
        var botonRevisar = document.getElementById("verCliente");

        pantalla.value = resultado;
        botonRevisar.textContent = "Revisar Datos";
        botonRevisar.disabled = false;
      }

      // --- BOTÓN REVISAR ---
      document
        .getElementById("verCliente")
        .addEventListener("click", function () {
          var botonRevisar = document.getElementById("verCliente");
          var pantalla = document.getElementById("resultado");

          // Con Select2, el valor sigue estando en el elemento original, así que esto funciona:
          var selector = document.getElementById("clientNumber");
          var valor = Number(selector.value);

          if (!selector.value) {
            pantalla.value =
              "⚠️ Por favor, busca y selecciona un número primero.";
            return;
          }

          botonRevisar.disabled = true;
          botonRevisar.innerHTML = "Cargando...";
          pantalla.value = "⏳ Consultando base de datos...";

          try {
            google.script.run
              .withSuccessHandler(mostrarPantalla)
              .obtenerDatosClientes(valor);
          } catch (e) {
            mostrarPantalla(
              "Nombre: Cliente Prueba\nCC: 12345\nEmail: test@test.com\n(Modo Prueba)",
            );
          }
        });

      // --- BOTÓN ELIMINAR CON CONFIRMACIÓN ---
      document
        .getElementById("eliminarCliente")
        .addEventListener("click", function () {
          var selector = document.getElementById("clientNumber");
          var valor = Number(selector.value);
          var pantalla = document.getElementById("resultado");

          if (!selector.value) {
            pantalla.value = "⚠️ Selecciona un cliente para eliminar.";
            return;
          }

          var confirmacion = confirm(
            "¿Estás SEGURO de que deseas eliminar al cliente número " +
              valor +
              "?\n\nEsta acción no se puede deshacer.",
          );

          if (!confirmacion) {
            pantalla.value = "Eliminación cancelada.";
            return;
          }

          var botonEliminar = document.getElementById("eliminarCliente");
          botonEliminar.disabled = true;
          botonEliminar.textContent = "Eliminando...";
          pantalla.value = "⏳ Procesando eliminación...";

          try {
            google.script.run
              .withSuccessHandler(function (mensaje) {
                pantalla.value = mensaje;
                botonEliminar.textContent = "Eliminar Cliente";
                botonEliminar.disabled = false;

                // Al recargar la lista, nuestra función poblarSelect se encargará de
                // reconstruir el buscador automáticamente
                google.script.run
                  .withSuccessHandler(poblarSelect)
                  .obtenerNumerosClientes();

                // Limpiamos la selección visualmente
                $j("#clientNumber").val(null).trigger("change");
              })
              .eliminarDatosClientes(valor);
          } catch (e) {
            pantalla.value = "❌ Error de conexión (Local)";
            botonEliminar.disabled = false;
            botonEliminar.textContent = "Eliminar Cliente";
          }
        });
    </script>
  </body>
